name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write   # to create releases
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        env:
          APP_BUILD: ${{ github.run_number }}
        run: |
          # On a v1.2.3 tag, the app's version becomes 1.2.3.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build_app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/CropAdvisor.app CropAdvisor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CropAdvisor
          path: CropAdvisor.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CropAdvisor.zip --title "$GITHUB_REF_NAME" --generate-notes
